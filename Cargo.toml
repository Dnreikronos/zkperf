[workspace]
members = [
    "crates/zkperf-adapter-protocol",
    "crates/zkperf-cli",
    "crates/zkperf-core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/Dnreikronos/zkperf"
publish = false

[workspace.dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
semver = "1.0.26"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["arbitrary_precision"] }
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
toml = "1.1.3"
uriparse = "0.6.4"
uuid = { version = "1.16.0", features = ["serde"] }
zkperf-adapter-protocol = { path = "crates/zkperf-adapter-protocol", version = "=0.1.0" }
zkperf-core = { path = "crates/zkperf-core", version = "=0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
