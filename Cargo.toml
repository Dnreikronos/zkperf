[workspace]
members = [
    "crates/zkperf-adapter-protocol",
    "crates/zkperf-cli",
    "crates/zkperf-core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/Dnreikronos/zkperf"
publish = false

[workspace.dependencies]
zkperf-adapter-protocol = { path = "crates/zkperf-adapter-protocol", version = "=0.1.0" }
zkperf-core = { path = "crates/zkperf-core", version = "=0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
