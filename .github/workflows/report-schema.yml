name: BenchmarkReport schema

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run conformance tests
        run: python -m unittest discover -s tests -v
      - name: Validate example reports
        run: python tools/validate_benchmark_reports.py examples/reports/*.json
